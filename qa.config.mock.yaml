project:
  name: "AutoQA Demo (deterministic verification config)"

target:
  url: "http://localhost:4173/"
  environment: "local-fixture"

browser:
  engine: "chromium"
  headless: true
  viewport:
    width: 1440
    height: 900

agent:
  maxActions: 80
  maxModelCalls: 60
  maxPages: 10
  maxFindings: 15
  maxDurationMs: 300000
  maxCriticCalls: 15

heuristics:
  longTextBoundaryChars: 500
  safeControlClick:
    enabled: true
    allowedControls: []

validation:
  attempts: 3
  minimumSuccesses: 2

oracles:
  uiApiConsistency:
    enabled: true
    rules:
      - id: "payment-consistency"
        request:
          method: "POST"
          pathname: "/api/payment-consistency"
        failureStatusMin: 500
        forbiddenVisibleText: "Payment successful"
  console:
    enabled: true
    ignorePatterns:
      - "Failed to load resource:"
  pageError:
    enabled: true
  httpFailure:
    enabled: true
  duplicateRequest:
    enabled: true
    patterns:
      - method: "POST"
        pathname: "/api/submit"
        expectedMax: 1

evidence:
  screenshots: true
  trace: true
  console: true
  network: true

models:
  explorer:
    provider: "mock"
  critic:
    enabled: true
    provider: "mock"
    requireIndependentProvider: false
    maxCallsPerFinding: 1
  providerTimeoutMs: 30000

requirements:
  enabled: true
  path: "fixture/requirements.json"

safety:
  safeMode: true
  allowedOrigins:
    - "http://localhost:4173"
