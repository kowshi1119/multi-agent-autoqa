project:
  name: "AutoQA Demo"

target:
  url: "http://localhost:4173/"
  environment: "local-fixture"

browser:
  engine: "chromium"
  headless: true
  viewport:
    width: 1440
    height: 900

agent:
  maxActions: 50
  maxModelCalls: 30
  maxPages: 10
  maxFindings: 10
  maxDurationMs: 300000

heuristics:
  longTextBoundaryChars: 500

validation:
  attempts: 3
  minimumSuccesses: 2

oracles:
  console:
    enabled: true
    # Chromium auto-logs a failed fetch/XHR as a console error too; the
    # http-failure oracle already owns that signal (it reads the network
    # response status directly), so console-error ignores it to avoid
    # reporting the same underlying defect twice under different oracles.
    ignorePatterns:
      - "Failed to load resource:"
  pageError:
    enabled: true
  httpFailure:
    enabled: true
  duplicateRequest:
    enabled: true
    patterns:
      - method: "POST"
        pathname: "/api/submit"
        expectedMax: 1

evidence:
  screenshots: true
  trace: true
  console: true
  network: true

models:
  provider: "auto"
  model: "claude-sonnet-5"

safety:
  safeMode: true
  allowedOrigins:
    - "http://localhost:4173"
