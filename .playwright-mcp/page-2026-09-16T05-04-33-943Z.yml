            - paragraph [ref=f33e1207]: 32 Spring Street, Paddington W2 1JA
        - list [ref=f33e1208]:
          - listitem [ref=f33e1209]:
            - paragraph [ref=f33e1210]: VAT Number - 119618600
        - paragraph [ref=f33e1211]:
          - strong [ref=f33e1212]: Accessing our site
        - paragraph [ref=f33e1213]: Access to our site is permitted on a temporary basis, and we reserve the right to withdraw or amend the service we provide on our site without notice (see below). We will not be liable if for any reason our site is unavailable at any time or for any period.
