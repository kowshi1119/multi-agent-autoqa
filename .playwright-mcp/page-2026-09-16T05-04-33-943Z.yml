          - strong [ref=f33e1200]: Information About Us
        - paragraph [ref=f33e1201]: "This site is operated by the Company as named on each page of this website (“We”). We are registered in England and Wales. Our Registered office, place of business, Company number and VAT number are as follows:"
        - list [ref=f33e1202]:
          - listitem [ref=f33e1203]:
            - paragraph [ref=f33e1204]: Monex International Ltd. - 04974470
        - list [ref=f33e1205]:
