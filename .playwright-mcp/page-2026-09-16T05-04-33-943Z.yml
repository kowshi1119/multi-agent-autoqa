- generic [active] [ref=f33e1]:
  - generic [ref=f33e192]:
    - banner [ref=f33e193]:
      - link [ref=f33e194] [cursor=pointer]:
        - /url: /login
        - img "Ajeer Money" [ref=f33e195]
    - generic [ref=f33e197]:
      - generic [ref=f33e198]:
        - heading "Terms & Condition" [level=1] [ref=f33e199]
        - paragraph [ref=f33e200]: "Version 1.1 — Last updated: 30 June 2026"
      - generic [ref=f33e201]:
        - paragraph [ref=f33e202]:
          - strong [ref=f33e203]: Background
        - paragraph [ref=f33e204]:
          - strong [ref=f33e205]: Our relationship with you
        - list [ref=f33e206]:
          - listitem [ref=f33e207]:
            - paragraph [ref=f33e208]: "The Ajeer Money Relationship Agreement (the “ Agreement”) comprises terms and conditions governing the relationship between the individual (acting outside the course of a business or profession) named in the Application Form (the “Customer”, “you”, “your”) and Monex International Limited trading as Ajeer Money (“Ajeer Money” “ Ajeer “ “us”, “we”, “our”), that apply to certain of our products and services. Our products and services allow you to: load funds onto a Currency account; make payments to one or more Beneficiaries nominated by you; and enter into foreign exchange transactions (including spots and commercial forwards), collectively, the “Services”."
        - list [ref=f33e209]:
          - listitem [ref=f33e210]:
            - paragraph [ref=f33e211]: load funds onto a Currency account;
        - list [ref=f33e212]:
          - listitem [ref=f33e213]:
            - paragraph [ref=f33e214]: make payments to one or more Beneficiaries nominated by you; and
        - list [ref=f33e215]:
          - listitem [ref=f33e216]:
            - paragraph [ref=f33e217]: enter into foreign exchange transactions (including spots and commercial forwards), collectively, the “Services”.
        - list [ref=f33e218]:
          - listitem [ref=f33e219]:
            - paragraph [ref=f33e220]: "The following documents are incorporated into and form part of the Agreement:"
        - list [ref=f33e221]:
          - listitem [ref=f33e222]:
            - paragraph [ref=f33e223]: the terms and conditions set out in this document (the “Terms”); and
        - list [ref=f33e224]:
          - listitem [ref=f33e225]:
            - paragraph [ref=f33e226]: any terms and conditions set out in the Application Form.
        - list [ref=f33e227]:
          - listitem [ref=f33e228]:
            - paragraph [ref=f33e229]: We will provide you with separate terms and conditions for any services that fall outside the scope of the Agreement.
        - list [ref=f33e230]:
          - listitem [ref=f33e231]:
            - paragraph [ref=f33e232]: We recommend that you retain a copy of all the documents that make up the Agreement. If you would like a copy of any of the documents, you can contact us (using the details at Clause 11.1).
        - list [ref=f33e233]:
          - listitem [ref=f33e234]:
            - paragraph [ref=f33e235]: In the event of any conflict, any terms and conditions in the Application Form shall prevail over the provisions of the Schedule and the terms and conditions of this Agreement.
        - list [ref=f33e236]:
          - listitem [ref=f33e237]:
            - paragraph [ref=f33e238]: While this Agreement is in force, we will provide a copy of this Agreement to you on request.
        - list [ref=f33e239]:
          - listitem [ref=f33e240]:
            - paragraph [ref=f33e241]: "These Terms are divided into four separate parts:"
        - list [ref=f33e242]:
          - listitem [ref=f33e243]:
            - paragraph [ref=f33e244]: BACKGROUND sets out the terms and conditions governing our relationship with you;
        - list [ref=f33e245]:
          - listitem [ref=f33e246]:
            - paragraph [ref=f33e247]: YOUR CURRENCY ACCOUNT sets out the specific terms governing your Currency Account with us (and any Orders you may place using that Currency Account);
        - list [ref=f33e248]:
          - listitem [ref=f33e249]:
            - paragraph [ref=f33e250]: FX SERVICES sets out the specific terms governing the FX Services which we provide to you.
        - list [ref=f33e251]:
          - listitem [ref=f33e252]:
            - paragraph [ref=f33e253]: GENERAL sets out some general information and other importance terms governing the Agreement.
        - paragraph [ref=f33e254]:
          - strong [ref=f33e255]: Definitions and Interpretation
        - list [ref=f33e256]:
          - listitem [ref=f33e257]:
            - paragraph [ref=f33e258]: "Where the words set out below are used with capital letters in these Terms, they mean as follows:"
        - list [ref=f33e259]:
          - listitem [ref=f33e260]:
            - paragraph [ref=f33e261]: “Applicable Laws” means any applicable law, statute, regulation or legally binding requirement or order as interpreted taking appropriate account of regulatory policy, guidance or industry code, relating to either of the parties or subject matter in question, including (as amended from time to time) (i) the EMRs; (ii) the PSRs; (iii) the UK Money Laundering Regulations 2017; (iv) the Proceeds of Crime Act 2002; the UK Terrorism Act 2000 (as amended); and (v) UK and international financial sanctions regimes.
        - list [ref=f33e262]:
          - listitem [ref=f33e263]:
            - paragraph [ref=f33e264]: “Application Form” means Part 1 of the Application Form, any supplemental terms and any other information submitted by you therein.
        - list [ref=f33e265]:
          - listitem [ref=f33e266]:
            - paragraph [ref=f33e267]: “Authorised Party” means any natural person listed as an "Authorised Party" in Part 1 of the Application Form.
        - list [ref=f33e268]:
          - listitem [ref=f33e269]:
            - paragraph [ref=f33e270]: “Beneficiary” means you or any third-party payee which you include in your Order.
        - list [ref=f33e271]:
          - listitem [ref=f33e272]:
            - paragraph [ref=f33e273]: “Beneficiary Account” means the bank account to which you are sending funds.
        - list [ref=f33e274]:
          - listitem [ref=f33e275]:
            - paragraph [ref=f33e276]: “Business Day” means a day on which banks are open for general banking business in the City of London.
        - list [ref=f33e277]:
          - listitem [ref=f33e278]:
            - paragraph [ref=f33e279]: “Close Out” means reversing a Trade in the circumstances set out in Clause 21 or otherwise pursuant to this Agreement.
        - list [ref=f33e280]:
          - listitem [ref=f33e281]:
            - paragraph [ref=f33e282]: “Delivery Date” means the Business Day on which we will send funds to the Beneficiary Account.
        - list [ref=f33e283]:
          - listitem [ref=f33e284]:
            - paragraph [ref=f33e285]: “Currency Account” means the electronic money account which we shall provide to you and which is to be operated and used in accordance with these Terms.
        - list [ref=f33e286]:
          - listitem [ref=f33e287]:
            - paragraph [ref=f33e288]: “Ajeer Representative” means any of our representatives who you may contact with respect to the Services.
        - list [ref=f33e289]:
          - listitem [ref=f33e290]:
            - paragraph [ref=f33e291]: “EEA” means the European Economic Area.
        - list [ref=f33e292]:
          - listitem [ref=f33e293]:
            - paragraph [ref=f33e294]: “Effective Date” means as set out at Clause 4.1.
        - list [ref=f33e295]:
          - listitem [ref=f33e296]:
            - paragraph [ref=f33e297]: “EMRs” means the Electronic Money Regulations 2011 (as amended from time to time.
        - list [ref=f33e298]:
          - listitem [ref=f33e299]:
            - paragraph [ref=f33e300]: “Force Majeure Event” means an event which is due to abnormal and unforeseeable circumstances beyond a party's control, the consequences of which would have been unavoidable despite all efforts to the contrary, which may include an act or omission of government, any regulatory body or other competent authority, an interruption, failure or defect, or non-operation of our internet and telephone connections or other communication services.
        - list [ref=f33e301]:
          - listitem [ref=f33e302]:
            - paragraph [ref=f33e303]: “Forward Contract” means a foreign exchange contract under which we agree that on a specific date or specified range of dates in the future, to exchange money at an agreed exchange rate and at an agreed time, which shall be to facilitate payment for identifiable goods, services or direct investment.
        - list [ref=f33e304]:
          - listitem [ref=f33e305]:
            - paragraph [ref=f33e306]: "“Insolvent” means you or any other person takes (or threatens to take) any step-in connection with:"
        - list [ref=f33e307]:
          - listitem [ref=f33e308]:
            - paragraph [ref=f33e309]: your bankruptcy (including, for the avoidance of doubt, if a bankruptcy petition is presented against you, or you petition for your own bankruptcy);
        - list [ref=f33e310]:
          - listitem [ref=f33e311]:
            - paragraph [ref=f33e312]: the making of any composition, compromise, assignment or arrangement with any of your creditors;
        - list [ref=f33e313]:
          - listitem [ref=f33e314]:
            - paragraph [ref=f33e315]: the appointment of an interim receiver of your property under section 286 of the Insolvency Act 1986;
        - list [ref=f33e316]:
          - listitem [ref=f33e317]:
            - paragraph [ref=f33e318]: the appointment of a receiver in respect of you under the Mental Health Act 1983;
        - list [ref=f33e319]:
          - listitem [ref=f33e320]:
            - paragraph [ref=f33e321]: the appointment of any other, receiver or manager of any of your assets;
        - list [ref=f33e322]:
          - listitem [ref=f33e323]:
            - paragraph [ref=f33e324]: any analogous procedure in any jurisdiction; or
        - list [ref=f33e325]:
          - listitem [ref=f33e326]:
            - paragraph [ref=f33e327]: you are unable or admit inability to pay your debts as they fall due or you are deemed to or declared to be unable to pay your debts under applicable law.
        - list [ref=f33e328]:
          - listitem [ref=f33e329]:
            - paragraph [ref=f33e330]: “Limit Order” means an order to exchange money at a specified exchange rate and within a specified time period.
        - list [ref=f33e331]:
          - listitem [ref=f33e332]:
            - paragraph [ref=f33e333]: “Margin” means funds (in any currency which we may specify) that we may require you to provide to us as security for us entering into a Forward Contract with you.
        - list [ref=f33e334]:
          - listitem [ref=f33e335]:
            - paragraph [ref=f33e336]: “Margin Call” means a request by us for such sum as we consider will be necessary to maintain the amount of Margin relative to the value of the Purchase Currency.
        - list [ref=f33e337]:
          - listitem [ref=f33e338]:
            - paragraph [ref=f33e339]: “Nominated Account” means the Ajeer bank account which we specify in the Payment Confirmation.
        - list [ref=f33e340]:
          - listitem [ref=f33e341]:
            - paragraph [ref=f33e342]: “Online System” means the electronic platform and interface (hosted by us) through which you can access most (but not all) of the Services.
        - list [ref=f33e343]:
          - listitem [ref=f33e344]:
            - paragraph [ref=f33e345]: “Order” means such information as you may supply to us in respect of (a) a Transfer; or (b) a Trade.
        - list [ref=f33e346]:
          - listitem [ref=f33e347]:
            - paragraph [ref=f33e348]: “Payment” means cleared funds received by us from you in respect of a Trade in accordance with Clause 18.
        - list [ref=f33e349]:
          - listitem [ref=f33e350]:
            - paragraph [ref=f33e351]: “Payment Amount” means the full amount which you are required to pay us to fulfil your Trade as specified in your Payment Instruction Confirmation.
        - list [ref=f33e352]:
          - listitem [ref=f33e353]:
            - paragraph [ref=f33e354]: “Payment Instruction Confirmation” means the email we shall send you for the purpose of confirming the Payment Amount and the Beneficiary Account.
        - list [ref=f33e355]:
          - listitem [ref=f33e356]:
            - paragraph [ref=f33e357]: “Purchase Currency” means the currency which you shall buy from us.
        - list [ref=f33e358]:
          - listitem [ref=f33e359]:
            - paragraph [ref=f33e360]: “PSRs” means the Payment Services Regulations 2017.
        - list [ref=f33e361]:
          - listitem [ref=f33e362]:
            - paragraph [ref=f33e363]: “Sell Currency” means the currency which we shall sell to you.
        - list [ref=f33e364]:
          - listitem [ref=f33e365]:
            - paragraph [ref=f33e366]: “Services” means those currency exchange and related services as set out at Clause.
        - list [ref=f33e367]:
          - listitem [ref=f33e368]:
            - paragraph [ref=f33e369]: “Spot Contract” means a foreign exchange contract under which we agree to exchange money at an agreed rate within 48 hours of the contract being entered into.
        - list [ref=f33e370]:
          - listitem [ref=f33e371]:
            - paragraph [ref=f33e372]: “Trade” means a Spot Contract, Forward Contract entered into in accordance with Clause 4.
        - list [ref=f33e373]:
          - listitem [ref=f33e374]:
            - paragraph [ref=f33e375]: “Transfer” means a transfer of funds to a Beneficiary nominated by you.
        - list [ref=f33e376]:
          - listitem [ref=f33e377]:
            - paragraph [ref=f33e378]: “Transaction Receipt” means a confirmation sent by us (by email) setting out details of a Trade.
        - list [ref=f33e379]:
          - listitem [ref=f33e380]:
            - paragraph [ref=f33e381]: We have split the Terms into sections and inserted a number of headings in order to make them easier to read. The headings are not intended to affect the way that the Terms are interpreted.
        - paragraph [ref=f33e382]:
          - strong [ref=f33e383]: How to access our services
        - list [ref=f33e384]:
          - listitem [ref=f33e385]:
            - paragraph [ref=f33e386]: "To use our Services, you must register to create an Currency Account by either:"
        - list [ref=f33e387]:
          - listitem [ref=f33e388]:
            - paragraph [ref=f33e389]: using our Online System, clicking on “Open Account” and following the instructions; or
        - list [ref=f33e390]:
          - listitem [ref=f33e391]:
            - paragraph [ref=f33e392]: “Application Form” means Part 1 of the Application Form, any supplemental terms and any other information submitted by you therein.
        - list [ref=f33e393]:
          - listitem [ref=f33e394]:
            - paragraph [ref=f33e395]: completing a paper Application Form (which we shall provide to you) and signing and returning your Agreement to us.
        - list [ref=f33e396]:
          - listitem [ref=f33e397]:
            - paragraph [ref=f33e398]: "To use our Services, you must register to create an Currency Account by either:"
        - list [ref=f33e399]:
          - listitem [ref=f33e400]:
            - paragraph [ref=f33e401]: you must take all reasonable steps to keep your Currency Account log-in details safe at all times and never disclose them to anyone (Note. It is advisable to change your password regularly (at least every three (3) to six (6) months) in order to reduce the risk of a security breach in relation to your Currency Account);
        - list [ref=f33e402]:
          - listitem [ref=f33e403]:
            - paragraph [ref=f33e404]: if you have any indication or suspicion of your log-in details, password or other security features relating to your Currency Account being lost, stolen, misappropriated, used without authorisation or otherwise compromised, you must contact us without undue delay on becoming aware of the loss, theft, misappropriation or unauthorised use and change the password; and
        - list [ref=f33e405]:
          - listitem [ref=f33e406]:
            - paragraph [ref=f33e407]: if you think someone else knows your password, you must change it as soon as you can.
        - list [ref=f33e408]:
          - listitem [ref=f33e409]:
            - paragraph [ref=f33e410]: We may request additional documentation from you to comply with our obligations to our regulators or otherwise under Applicable Laws.
        - paragraph [ref=f33e411]:
          - strong [ref=f33e412]: Your relationship with us
        - list [ref=f33e413]:
          - listitem [ref=f33e414]:
            - paragraph [ref=f33e415]: "This Agreement shall take effect immediately upon:"
        - list [ref=f33e416]:
          - listitem [ref=f33e417]:
            - paragraph [ref=f33e418]: when you register via our website or mobile app and click to accept the Terms; or
        - list [ref=f33e419]:
          - listitem [ref=f33e420]:
            - paragraph [ref=f33e421]: if we communicate by phone or by email, receipt of a signed scanned copy of this Agreement (if we communicate by phone or by email),
        - list [ref=f33e422]:
          - listitem [ref=f33e423]:
            - paragraph [ref=f33e424]: This Agreement shall commence on the Effective Date and continue in full force and effect indefinitely unless and until terminated by you or us under Clause 9.
        - list [ref=f33e425]:
          - listitem [ref=f33e426]:
            - paragraph [ref=f33e427]: "You must tell us as soon as possible if any of the information you have given us changes, including:"
        - list [ref=f33e428]:
          - listitem [ref=f33e429]:
            - paragraph [ref=f33e430]: a change of name, address or Authorised Parties; or
        - list [ref=f33e431]:
          - listitem [ref=f33e432]:
            - paragraph [ref=f33e433]: a material change to your financial position.
        - paragraph [ref=f33e434]:
          - strong [ref=f33e435]: Your warranties
        - list [ref=f33e436]:
          - listitem [ref=f33e437]:
            - paragraph [ref=f33e438]: "You represent and warrant to us that as at the time of entering into this Agreement (and on an ongoing basis):"
        - list [ref=f33e439]:
          - listitem [ref=f33e440]:
            - paragraph [ref=f33e441]: you will at all times comply with all Applicable Laws and you will not use the Services for the purposes of money laundering, tax evasion or terrorist financing;
        - list [ref=f33e442]:
          - listitem [ref=f33e443]:
            - paragraph [ref=f33e444]: you will not use our Services for any speculative trading; and
        - list [ref=f33e445]:
          - listitem [ref=f33e446]:
            - paragraph [ref=f33e447]: all of the information provided to us (including in the Application Form) from time to time, is true, accurate and complete.
        - paragraph [ref=f33e448]:
          - strong [ref=f33e449]: Liability
        - list [ref=f33e450]:
          - listitem [ref=f33e451]:
            - paragraph [ref=f33e452]: As these Terms are provided to you as an individual, we will not be liable for any business losses or costs you suffer (such as loss of business profits or opportunities).
        - list [ref=f33e453]:
          - listitem [ref=f33e454]:
            - paragraph [ref=f33e455]: "We shall not be liable to you for any losses you incur:"
        - list [ref=f33e456]:
          - listitem [ref=f33e457]:
            - paragraph [ref=f33e458]: if we are prevented by Applicable Law from fulfilling any of our obligations under this Agreement;
        - list [ref=f33e459]:
          - listitem [ref=f33e460]:
            - paragraph [ref=f33e461]: arising out of or in connection with a Force Majeure Event; or
        - list [ref=f33e462]:
          - listitem [ref=f33e463]:
            - paragraph [ref=f33e464]: arising out of or in connection with any Transfer or Trade where we have acted on your direct instructions.
        - list [ref=f33e465]:
          - listitem [ref=f33e466]:
            - paragraph [ref=f33e467]: "Nothing in this Agreement shall operate to exclude or restrict either party's liability for:"
        - list [ref=f33e468]:
          - listitem [ref=f33e469]:
            - paragraph [ref=f33e470]: death or personal injury resulting from negligence;
        - list [ref=f33e471]:
          - listitem [ref=f33e472]:
            - paragraph [ref=f33e473]: fraud, fraudulent misrepresentation or deceit; or
        - list [ref=f33e474]:
          - listitem [ref=f33e475]:
            - paragraph [ref=f33e476]: anything else which cannot be restricted or excluded under Applicable Laws.
        - paragraph [ref=f33e477]:
          - strong [ref=f33e478]: Set-off Rights
        - list [ref=f33e479]:
          - listitem [ref=f33e480]:
            - paragraph [ref=f33e481]: "We may at any time set-off any amounts which you owe to us against:"
        - list [ref=f33e482]:
          - listitem [ref=f33e483]:
            - paragraph [ref=f33e484]: any liability we have towards you (whether under this Agreement or otherwise). If the liabilities to be set-off are expressed in different currencies, we may convert either liability at the market rate for the purpose of the set-off; and/or
        - list [ref=f33e485]:
          - listitem [ref=f33e486]:
            - paragraph [ref=f33e487]: any amount then attributed to you held in the Currency Account.
        - list [ref=f33e488]:
          - listitem [ref=f33e489]:
            - paragraph [ref=f33e490]: All amounts due to us under this Clause 7 shall be paid to us in full and you shall only be able to deduct or withhold any amounts subject to tax as required by Applicable Laws.
        - list [ref=f33e491]:
          - listitem [ref=f33e492]:
            - paragraph [ref=f33e493]: If a payment is overdue for more than seven (7) days, you shall pay interest on the overdue amount at the rate of 3% p.a. above NatWest Bank PLC base rate (or any successor rate) from time to time. Such interest shall accrue on a daily basis from the due date until actual payment of the overdue amount.
        - list [ref=f33e494]:
          - listitem [ref=f33e495]:
            - paragraph [ref=f33e496]: If any amount remains unpaid, we may take debt collection measures including appointing a debt collecting agency or other third parties to assist with the recovery of any amounts due and payable by you to us.
        - paragraph [ref=f33e497]:
          - strong [ref=f33e498]: Changes to this Agreement
        - list [ref=f33e499]:
          - listitem [ref=f33e500]:
            - paragraph [ref=f33e501]: We will from time to time need to change the terms of this Agreement. We can anticipate some of the reasons why it would be fair for us to do this and have listed them below, but we may in the future also want to make changes for other reasons.
        - list [ref=f33e502]:
          - listitem [ref=f33e503]:
            - paragraph [ref=f33e504]: "We can make a change to this Agreement for any reason (including the following), provided that any change is a reasonable and proportionate response to a change that is affecting us or that we reasonably think will affect us:"
        - list [ref=f33e505]:
          - listitem [ref=f33e506]:
            - paragraph [ref=f33e507]: because of a change in Applicable Laws, for example we may have to change our requirements for keeping your Currency Account safe to meet new, higher standards set by law;
        - list [ref=f33e508]:
          - listitem [ref=f33e509]:
            - paragraph [ref=f33e510]: if the change benefits you, for example by introducing new products or services or improving existing ones;
        - list [ref=f33e511]:
          - listitem [ref=f33e512]:
            - paragraph [ref=f33e513]: to reflect a change in our costs of running your Currency Account or providing related services, for example by introducing a new fee;
        - list [ref=f33e514]:
          - listitem [ref=f33e515]:
            - paragraph [ref=f33e516]: in response to possible risks to the security of your Currency Account, for example by changing the security steps required to access your Account or submit an Order; or
        - list [ref=f33e517]:
          - listitem [ref=f33e518]:
            - paragraph [ref=f33e519]: to respond to any other change that affects us, where it is fair to pass on the effects of the change to you, for example to reflect developments in digital payments.
        - list [ref=f33e520]:
          - listitem [ref=f33e521]:
            - paragraph [ref=f33e522]: We may also make changes for reasons we cannot reasonably foresee at the time, for example to respond to changes among our competitors that affect how we deliver our services to you.
        - list [ref=f33e523]:
          - listitem [ref=f33e524]:
            - paragraph [ref=f33e525]: We shall notify you of any change to this Agreement in writing (either by post or email). Any proposed variation shall come into effect automatically on the date stated in our notice, which will be at least two (2) months after the date you receive the notice.
        - list [ref=f33e526]:
          - listitem [ref=f33e527]:
            - paragraph [ref=f33e528]:
              - text: You may notify us at
              - link "cs@Ajeer.money" [ref=f33e529] [cursor=pointer]:
                - /url: mailto:cs@Ajeer.money
              - text: that you wish to end this Agreement (and close your Currency Account) before the change takes effect. If you do not do so, you will be treated as having accepted the change.
        - paragraph [ref=f33e530]:
          - strong [ref=f33e531]: Termination
        - list [ref=f33e532]:
          - listitem [ref=f33e533]:
            - paragraph [ref=f33e534]: You may terminate this Agreement at any time without reason by giving at least one (1) month's prior notice to us.
        - list [ref=f33e535]:
          - listitem [ref=f33e536]:
            - paragraph [ref=f33e537]: We may terminate this Agreement at any time without reason by giving at least two (2) months' prior notice to you.
        - list [ref=f33e538]:
          - listitem [ref=f33e539]:
            - paragraph [ref=f33e540]: "We may terminate this Agreement immediately without notice (in whole or in part) if:"
        - list [ref=f33e541]:
          - listitem [ref=f33e542]:
            - paragraph [ref=f33e543]: you are using our Services fraudulently or illegally;
        - list [ref=f33e544]:
          - listitem [ref=f33e545]:
            - paragraph [ref=f33e546]: if we are required to do so by law or a regulator;
        - list [ref=f33e547]:
          - listitem [ref=f33e548]:
            - paragraph [ref=f33e549]: in our view (acting reasonably), we must do so to fulfil our legal or regulatory obligations; or
        - list [ref=f33e550]:
          - listitem [ref=f33e551]:
            - paragraph [ref=f33e552]: you breach this Agreement.
        - paragraph [ref=f33e553]: We will tell you that we're doing this as soon as we can if the law allows us to.
        - list [ref=f33e554]:
          - listitem [ref=f33e555]:
            - paragraph [ref=f33e556]: "Otherwise, we may suspend or terminate this Agreement or the Services (in whole or in part) at any time with immediate effect by giving notice if:"
        - list [ref=f33e557]:
          - listitem [ref=f33e558]:
            - paragraph [ref=f33e559]: you breach any material representation or warranty or are otherwise in material breach of this Agreement;
        - list [ref=f33e560]:
          - listitem [ref=f33e561]:
            - paragraph [ref=f33e562]: you breach or otherwise fails to comply with any Applicable Laws;
        - list [ref=f33e563]:
          - listitem [ref=f33e564]:
            - paragraph [ref=f33e565]: we have any material concerns over the adequacy of the information you have provided to us;
        - list [ref=f33e566]:
          - listitem [ref=f33e567]:
            - paragraph [ref=f33e568]: you are Insolvent;
        - list [ref=f33e569]:
          - listitem [ref=f33e570]:
            - paragraph [ref=f33e571]: an applicable regulatory or law enforcement authority initiates a regulatory or enforcement action, or investigation against you;
        - list [ref=f33e572]:
          - listitem [ref=f33e573]:
            - paragraph [ref=f33e574]: there is any other change in your circumstances (including a deterioration in or change to your financial position) which we consider materially adverse to the continuance of the Services;
        - list [ref=f33e575]:
          - listitem [ref=f33e576]:
            - paragraph [ref=f33e577]: a Force Majeure Event continues for more than three (3) successive calendar months; or
        - list [ref=f33e578]:
          - listitem [ref=f33e579]:
            - paragraph [ref=f33e580]: in our reasonable opinion, you are no longer suitable to receive the Services.
        - paragraph [ref=f33e581]:
          - strong [ref=f33e582]: Consequences of Termination
        - list [ref=f33e583]:
          - listitem [ref=f33e584]:
            - paragraph [ref=f33e585]: "On the expiry or termination of this Agreement for any reason you shall:"
        - list [ref=f33e586]:
          - listitem [ref=f33e587]:
            - paragraph [ref=f33e588]: immediately make payment in full for all pending Trades (for the avoidance of doubt, we shall remain entitled to set-off or deduct sums in accordance with Clause 7); and
        - list [ref=f33e589]:
          - listitem [ref=f33e590]:
            - paragraph [ref=f33e591]: except as otherwise expressly provided in this Agreement and subject to any rights or obligations which have accrued prior to termination, neither party shall have any further obligation to the other under this Agreement.
        - list [ref=f33e592]:
          - listitem [ref=f33e593]:
            - paragraph [ref=f33e594]: "Following termination of this Agreement, we will:"
        - list [ref=f33e595]:
          - listitem [ref=f33e596]:
            - paragraph [ref=f33e597]: Close Out any pending Trades; and
        - list [ref=f33e598]:
          - listitem [ref=f33e599]:
            - paragraph [ref=f33e600]: deduct from the Currency Account all fees and other amounts owing under this Agreement and transfer any remaining funds to your nominated bank account (without prejudice to the other provisions of this Agreement).
        - list [ref=f33e601]:
          - listitem [ref=f33e602]:
            - paragraph [ref=f33e603]: The termination of this Agreement shall not affect any provisions of this Agreement that are expressly or by necessary implication intended to survive such termination.
        - paragraph [ref=f33e604]:
          - strong [ref=f33e605]: Contacting us / Complaints
        - list [ref=f33e606]:
          - listitem [ref=f33e607]:
            - paragraph [ref=f33e608]:
              - text: If you wish to contact us regarding your Currency Account or any of the Services, you can do so (unless we say otherwise) through an Ajeer Representative or otherwise by contacting
              - link "cs@Ajeer.money" [ref=f33e609] [cursor=pointer]:
                - /url: mailto:cs@Ajeer.money
              - text: .
        - list [ref=f33e610]:
          - listitem [ref=f33e611]:
            - paragraph [ref=f33e612]: "If you are unhappy with any of our Services, you can contact us in writing by using any of the following details:"
        - paragraph [ref=f33e613]: "Post :"
        - paragraph [ref=f33e614]: Compliance Department
        - paragraph [ref=f33e615]: Monex International Ltd
        - paragraph [ref=f33e616]: 32 Spring Street
        - paragraph [ref=f33e617]: Paddington
        - paragraph [ref=f33e618]: W2 1JA
        - paragraph [ref=f33e619]: UK
        - paragraph [ref=f33e620]:
          - text: "Email :"
          - link "cs@Ajeer.money" [ref=f33e621] [cursor=pointer]:
            - /url: mailto:cs@Ajeer.money
        - list [ref=f33e622]:
          - listitem [ref=f33e623]:
            - paragraph [ref=f33e624]:
              - text: "If you want to speak to an Ajeer Representative directly, please use the contact telephone numbers at the following link:"
              - link "https://Ajeer.money/supporthome" [ref=f33e625] [cursor=pointer]:
                - /url: https://Ajeer.money/supporthome
        - list [ref=f33e626]:
          - listitem [ref=f33e627]:
            - paragraph [ref=f33e628]:
              - text: For further information on our Complaints Policy, please see
              - link "www.Ajeer.money/policy" [ref=f33e629] [cursor=pointer]:
                - /url: https://www.ajeer.money/policy
              - text: .
        - list [ref=f33e630]:
          - listitem [ref=f33e631]:
            - paragraph [ref=f33e632]:
              - text: If your complaint remains unresolved, you may be entitled to refer it to the Financial Ombudsman Service ("FOS"). Further information, contact details and the eligibility requirements can be located on
              - link "www.financial-ombudsman.org.uk" [ref=f33e633] [cursor=pointer]:
                - /url: http://www.financial-ombudsman.org.uk
              - text: "In certain circumstances you may also be able to submit your complaint to the FCA who will use your complaint to inform their regulatory activities. For further details please contact the FCA on: Phone: 0800 023 4567 (free from UK landlines and mobiles). Post: Financial Ombudsmen Service, Exchange Tower, London, E14 9SR"
        - list [ref=f33e634]:
          - listitem [ref=f33e635]:
            - paragraph [ref=f33e636]: Our Services are not covered by the UK Financial Services Compensation Scheme
        - paragraph [ref=f33e637]:
          - strong [ref=f33e638]: The currency Account
        - list [ref=f33e639]:
          - listitem [ref=f33e640]:
            - paragraph [ref=f33e641]: Your Currency Account is an account which enables you to create send and receive electronic payment instructions in accordance with the terms of this Clause 12.
        - list [ref=f33e642]:
          - listitem [ref=f33e643]:
            - paragraph [ref=f33e644]: Your Currency Account is not a personal bank or deposit account and you will not earn any interest on the funds held in the Currency Account.
        - list [ref=f33e645]:
          - listitem [ref=f33e646]:
            - paragraph [ref=f33e647]: "As the provider of your Currency Account, we are authorised by the Financial Conduct Authority under the SPI (FRN: 510848) as a small Payment Institution, which allow us to provide payment services."
        - list [ref=f33e648]:
          - listitem [ref=f33e649]:
            - paragraph [ref=f33e650]: As a payment institution, we are required to ensure that customer funds are appropriately “safeguarded”. This means that funds received by us corresponding to electronic money will be held in one or more segregated bank accounts separately from our own funds, in accordance with the EMRs. In the event of our insolvency, these funds will form an asset pool which is separate from our insolvent estate and an administrator will be entitled to reimburse you from this pool (in priority to other creditors).
        - list [ref=f33e651]:
          - listitem [ref=f33e652]:
            - paragraph [ref=f33e653]: Your Currency Account(s) are denominated in the currency as selected by you.
        - paragraph [ref=f33e654]:
          - strong [ref=f33e655]: Using the currency account
        - list [ref=f33e656]:
          - listitem [ref=f33e657]:
            - paragraph [ref=f33e658]: We will credit any funds received from you to your Currency Account transaction.
        - list [ref=f33e659]:
          - listitem [ref=f33e660]:
            - paragraph [ref=f33e661]: "Your Currency Account can be used to:"
        - list [ref=f33e662]:
          - listitem [ref=f33e663]:
            - paragraph [ref=f33e664]: remit funds in a currency nominated by you in your Application Form;
        - list [ref=f33e665]:
          - listitem [ref=f33e666]:
            - paragraph [ref=f33e667]: make Transfers (alone or in combination with a Trade);
        - list [ref=f33e668]:
          - listitem [ref=f33e669]:
            - paragraph [ref=f33e670]: make Payment in connection with one or more Trades; and
        - list [ref=f33e671]:
          - listitem [ref=f33e672]:
            - paragraph [ref=f33e673]: make any payment of Margin in accordance with Clause 19.
        - list [ref=f33e674]:
          - listitem [ref=f33e675]:
            - paragraph [ref=f33e676]: We will not make any Transfer or Payment Out of your Currency Account where this would put your Currency Account into a negative balance. You should therefore ensure that you have sufficient funds, including in respect of Margin Calls which may be made from time-to-time, in your Account before creating a transaction.
        - list [ref=f33e677]:
          - listitem [ref=f33e678]:
            - paragraph [ref=f33e679]: We may apply spending limits on your Currency Account (for example, the maximum amount of Transfers or Trades that you can make in one day or the maximum exposure you can have to a single currency), and we'll tell you if we do so.
        - list [ref=f33e680]:
          - listitem [ref=f33e681]:
            - paragraph [ref=f33e682]: We do not impose fees or charges for our Services save for same-currency Transfers or Trades, where we may impose a reasonable charge which we will negotiate with you. We will let you know of our fees in advance of accepting any Trades or Transfers.
        - list [ref=f33e683]:
          - listitem [ref=f33e684]:
            - paragraph [ref=f33e685]: However, others might impose fees, charges or taxes. For example, a correspondent bank who is involved in processing your Transfer charge you a fee to transmit funds to the Beneficiary Account.
        - list [ref=f33e686]:
          - listitem [ref=f33e687]:
            - paragraph [ref=f33e688]: The exchange rates we use are variable exchange rates which are changing constantly throughout the day (for example, to reflect movements in foreign exchange markets). The exchange rate applied to your payments will appear on your statement. Unless otherwise agreed with you, the exchange rate we will apply to Transfers (including any future dated payments) and Trades which are in a different currency to the denomination of your Currency Account will be the rate applicable at the time that your payment is processed. You can contact us to find out the rate which will apply by contacting your Ajeer Representative.
        - list [ref=f33e689]:
          - listitem [ref=f33e690]:
            - paragraph [ref=f33e691]: "You can place an Order from your Currency Account online, by telephone or by email:"
        - list [ref=f33e692]:
          - listitem [ref=f33e693]:
            - paragraph [ref=f33e694]: "Online: You must log on to the Online System (using your password and log-in details) and follow the instructions to submit your Order."
        - list [ref=f33e695]:
          - listitem [ref=f33e696]:
            - paragraph [ref=f33e697]: "Telephone: You must call an Ajeer Representative and specify your Order, together with such other information as we may reasonably request."
        - list [ref=f33e698]:
          - listitem [ref=f33e699]:
            - paragraph [ref=f33e700]: "Email: You must email us and specify your Order."
        - list [ref=f33e701]:
          - listitem [ref=f33e702]:
            - paragraph [ref=f33e703]: If you confirm an Order (and make Payment in accordance with Clause 18) on a non-Business Day (or after our cut off times (which we shall make available on our website)), we'll process your Transfer on the next Business Day.
        - list [ref=f33e704]:
          - listitem [ref=f33e705]:
            - paragraph [ref=f33e706]: We will send the funds to the Beneficiary Account nominated by you.
        - list [ref=f33e707]:
          - listitem [ref=f33e708]:
            - paragraph [ref=f33e709]: If the Beneficiary Account is held in the EEA and is in pounds sterling (£), euro (€) or another EEA currency, the account provider (e.g. bank) will receive the money by the end of the next Business Day after you ask us to send it. Otherwise, if the Beneficiary Account is held in the EEA (and the transaction is in a non-EEA currency), the account provider will receive the money within four Business Days after you ask us to send it.
        - list [ref=f33e710]:
          - listitem [ref=f33e711]:
            - paragraph [ref=f33e712]: The Beneficiary's account provider may apply its own charges to the Transfer.
        - list [ref=f33e713]:
          - listitem [ref=f33e714]:
            - paragraph [ref=f33e715]: Where you make Remittance using your Currency Account, you must ensure that you have sufficient funds to cover the amount of any Trade or Transfer you want to make using the Account. If you do not have sufficient funds to settle us in time as requested, we reserve the right to postpone the execution date of the Trade or Transfer and we may impose a charge to cover the costs of us doing so.
        - list [ref=f33e716]:
          - listitem [ref=f33e717]:
            - paragraph [ref=f33e718]: We will make available to you through the Online System key information relating to all transactions on your Currency Account and a transaction history at any time and such information may also be downloaded as a report which can be stored and reproduced in an unchanged manner.
        - list [ref=f33e719]:
          - listitem [ref=f33e720]:
            - paragraph [ref=f33e721]: Each transaction made using the Currency Account will be given a unique transaction ID which will be set out in the transaction history. You must quote this transaction ID when communicating with a Ajeer Representative about a particular transaction.
        - paragraph [ref=f33e722]:
          - strong [ref=f33e723]: Liability
        - list [ref=f33e724]:
          - listitem [ref=f33e725]:
            - paragraph [ref=f33e726]: Improper execution
        - list [ref=f33e727]:
          - listitem [ref=f33e728]:
            - paragraph [ref=f33e729]: If there is a defective or non-executed transaction to or from the Currency Account, we will without undue delay refund the amount of a payment and any charges you have paid as a result, subject to the other provisions of this Clause 14.
        - list [ref=f33e730]:
          - listitem [ref=f33e731]:
            - paragraph [ref=f33e732]: We will not be liable if the error was caused by the sender's payment service provider (for a payment to the Currency Account) or the Beneficiary's payment service provider (for a payment from the Currency Account), unless we are also that payment service provider.
        - list [ref=f33e733]:
          - listitem [ref=f33e734]:
            - paragraph [ref=f33e735]: If a payment goes to the wrong person, or is delayed, because you gave us the wrong details, we will not be liable but will use reasonable efforts to try to recover the payment. We may charge reasonable costs for doing so.
        - list [ref=f33e736]:
          - listitem [ref=f33e737]:
            - paragraph [ref=f33e738]: Unauthorised payments
        - list [ref=f33e739]:
          - listitem [ref=f33e740]:
            - paragraph [ref=f33e741]: If there is a payment from the Currency Account that you did not authorise, we will immediately refund the payment and any charges you have paid as a result subject to the other provisions of this Clause 14.
        - list [ref=f33e742]:
          - listitem [ref=f33e743]:
            - paragraph [ref=f33e744]: If we can show that you acted fraudulently, you will be liable for all payments from the Currency Account that we could not stop.
        - list [ref=f33e745]:
          - listitem [ref=f33e746]:
            - paragraph [ref=f33e747]: If we can show you have been grossly negligent in keeping safe your Profile log-in name and password or any device used by you to access our Services, you will be liable for payments from the Currency Account but only if the payments are not in connection with a distance contract (as defined in regulation 77(5) PSRs) and only until you have informed us that any device or log-in details have been lost, stolen or could be misused.
        - list [ref=f33e748]:
          - listitem [ref=f33e749]:
            - paragraph [ref=f33e750]: You should without undue delay notify us (using the details at Clause 11.1) if you becomes aware of the loss, theft or misuse of your Profile log-in details or any device which you use to access your Profile.
        - list [ref=f33e751]:
          - listitem [ref=f33e752]:
            - paragraph [ref=f33e753]: We will not provide a refund under Clauses 14.2.2 or 14.2.3 if you fail to bring an unauthorised or incorrectly executed transaction to our attention without undue delay and in any case within thirteen (13) months of the date of the Trade or Transfer. However, we will try to trace the transaction for you (if you ask us to) and impose a reasonable charge to cover the costs of doing this.
        - paragraph [ref=f33e754]:
          - strong [ref=f33e755]: Limiting use of your account
        - list [ref=f33e756]:
          - listitem [ref=f33e757]:
            - paragraph [ref=f33e758]: We may suspend the Currency Account or otherwise restrict its functionality on reasonable grounds relating to the security of the Currency Account or any of its security features or if we reasonably suspect that an unauthorised or fraudulent use of the Currency Account has occurred or that any of its security features have been compromised.
        - list [ref=f33e759]:
          - listitem [ref=f33e760]:
            - paragraph [ref=f33e761]: We will notify you of any suspension or restriction and of the reasons for such suspension or restriction in advance or, where we are unable to do so, immediately after the suspension or restriction has been imposed, unless that would be unlawful or compromise our reasonable security interests.
        - list [ref=f33e762]:
          - listitem [ref=f33e763]:
            - paragraph [ref=f33e764]: We will lift the suspension and/or the restriction as soon as practicable after the reasons for the suspension and/or restriction have ceased to exist.
        - list [ref=f33e765]:
          - listitem [ref=f33e766]:
            - paragraph [ref=f33e767]: If we suspect or become aware that your Currency Account may be subject to fraud or security threats we'll contact you using the contact details we hold for you.
        - paragraph [ref=f33e768]:
          - strong [ref=f33e769]: Closing the currency account
        - list [ref=f33e770]:
          - listitem [ref=f33e771]:
            - paragraph [ref=f33e772]: Following termination of this Agreement, you or we may close your Currency Account once we have paid any remaining balance on the Currency Account to your nominated bank Account
        - paragraph [ref=f33e773]:
          - strong [ref=f33e774]: FX SERVICES
        - paragraph [ref=f33e775]: "Note: The FX Services described in this Part C do not constitute the issuance of electronic money nor payment services activity and are therefore not subject to regulation by the FCA under the PSRs/EMRs."
        - paragraph [ref=f33e776]:
          - strong [ref=f33e777]: Placing Trades
        - list [ref=f33e778]:
          - listitem [ref=f33e779]:
            - paragraph [ref=f33e780]: How to Place and Confirm a Trade
        - list [ref=f33e781]:
          - listitem [ref=f33e782]:
            - paragraph [ref=f33e783]: You can place an Order by using one of the methods at Clause 13.8 online, by telephone or by email.
        - list [ref=f33e784]:
          - listitem [ref=f33e785]:
            - paragraph [ref=f33e786]: "Once we have received your Order, we will confirm:"
        - list [ref=f33e787]:
          - listitem [ref=f33e788]:
            - paragraph [ref=f33e789]: the amount of the Sale Currency and the Purchase Currency;
        - list [ref=f33e790]:
          - listitem [ref=f33e791]:
            - paragraph [ref=f33e792]: the foreign exchange rate which we intend to apply;
        - list [ref=f33e793]:
          - listitem [ref=f33e794]:
            - paragraph [ref=f33e795]: any Payment to be made in accordance with Clause 18;
        - list [ref=f33e796]:
          - listitem [ref=f33e797]:
            - paragraph [ref=f33e798]: any Margin payable by you in accordance with Clause 19; and
        - list [ref=f33e799]:
          - listitem [ref=f33e800]:
            - paragraph [ref=f33e801]: any additional terms which we intend to apply to the Trade.
        - list [ref=f33e802]:
          - listitem [ref=f33e803]:
            - paragraph [ref=f33e804]: Upon receipt of an Order, we will provide you with a Transaction Receipt and a Payment Instruction Confirmation, which we may provide in a single communication.
        - list [ref=f33e805]:
          - listitem [ref=f33e806]:
            - paragraph [ref=f33e807]: You must carefully review the Transaction Receipt and the Payment Instruction Confirmation and tell us before Payment if you think any of the details are incorrect. If you are placing an order by telephone or by email, you must tell us within one (1) hour of receipt of your Transaction Receipt and Payment Instruction Confirmation. We'll provide you with a revised Transaction Receipt and/or Payment Instruction Confirmation as soon as possible.
        - list [ref=f33e808]:
          - listitem [ref=f33e809]:
            - paragraph [ref=f33e810]: Except in the case of Limit Orders (see Clause 20 below), we will execute and process the Remittance upon receipt of Payment.
        - list [ref=f33e811]:
          - listitem [ref=f33e812]:
            - paragraph [ref=f33e813]: "You may not cancel a Trade which you have placed with us. However, if we haven't yet processed the Trade:"
        - list [ref=f33e814]:
          - listitem [ref=f33e815]:
            - paragraph [ref=f33e816]: you can correct any incorrect Beneficiary Account details (though we may charge a fee for this); or
        - list [ref=f33e817]:
          - listitem [ref=f33e818]:
            - paragraph [ref=f33e819]: we may at our discretion permit you to cancel the Trade.
        - list [ref=f33e820]:
          - listitem [ref=f33e821]:
            - paragraph [ref=f33e822]: "If we permit you to cancel an Order:"
        - list [ref=f33e823]:
          - listitem [ref=f33e824]:
            - paragraph [ref=f33e825]: if we've already received the Payment Amount, we'll return it to the account from where it came. However, if the Sale and Purchase Currencies are different, we'll convert the Purchase Currency back to the Sale Currency using an agreed exchange rate at the time of cancellation, which means the amount we return to you may be more or less than the original Payment Amount;
        - list [ref=f33e826]:
          - listitem [ref=f33e827]:
            - paragraph [ref=f33e828]: we won't refund any fees you've paid us; and
        - list [ref=f33e829]:
          - listitem [ref=f33e830]:
            - paragraph [ref=f33e831]: we may require you to pay an additional fee that we agree with you at the time of permitting cancellation.
        - list [ref=f33e832]:
          - listitem [ref=f33e833]:
            - paragraph [ref=f33e834]: Trade Suspension or Cancellation
        - list [ref=f33e835]:
          - listitem [ref=f33e836]:
            - paragraph [ref=f33e837]: "We may reject, suspend, disregard or cancel a Trade, or refuse to issue a Transaction Receipt in our sole discretion for any of the following reasons:"
        - list [ref=f33e838]:
          - listitem [ref=f33e839]:
            - paragraph [ref=f33e840]: if (in our reasonable opinion) the Order is unclear;
        - list [ref=f33e841]:
          - listitem [ref=f33e842]:
            - paragraph [ref=f33e843]: if (in our reasonable opinion) the Order was not authorised by an Authorised Party;
        - list [ref=f33e844]:
          - listitem [ref=f33e845]:
            - paragraph [ref=f33e846]: you are Insolvent;
        - list [ref=f33e847]:
          - listitem [ref=f33e848]:
            - paragraph [ref=f33e849]: you breach any material representation or warranty or are otherwise in breach of this Agreement;
        - list [ref=f33e850]:
          - listitem [ref=f33e851]:
            - paragraph [ref=f33e852]: we may otherwise breach Applicable Law or face action from a regulator or other authority;
        - list [ref=f33e853]:
          - listitem [ref=f33e854]:
            - paragraph [ref=f33e855]: the Trade may be linked to activity that breaches Applicable Law;
        - list [ref=f33e856]:
          - listitem [ref=f33e857]:
            - paragraph [ref=f33e858]: you have failed to pay make Payment when due or are otherwise in breach of this Agreement or any other agreement you have with us;
        - list [ref=f33e859]:
          - listitem [ref=f33e860]:
            - paragraph [ref=f33e861]: you fail to provide us with sufficient information to allow us to fulfil the Trade; and
        - list [ref=f33e862]:
          - listitem [ref=f33e863]:
            - paragraph [ref=f33e864]: the Trade is outside our financial crime risk appetite.
        - list [ref=f33e865]:
          - listitem [ref=f33e866]:
            - paragraph [ref=f33e867]: We'll notify you of the reason for declining, cancelling or delaying a Trade (if the law allows us to) and also, if possible, our reasons for doing so and how you can put right any factual errors that led to our action
        - list [ref=f33e868]:
          - listitem [ref=f33e869]:
            - paragraph [ref=f33e870]: If we cancel a Trade after receiving the Payment, we'll return the relevant amount and any related fees we've received (less our reasonable costs) to the account from which it was sent.
        - paragraph [ref=f33e871]:
          - strong [ref=f33e872]: Payment
        - list [ref=f33e873]:
          - listitem [ref=f33e874]:
            - paragraph [ref=f33e875]: "You must pay the full Payment Amount to us from your Bank Account on or before the requested time. If we have not received the Payment Amount by that time (or any agreed change to the Delivery Date agreed pursuant to Clause 19.7), we may:"
        - list [ref=f33e876]:
          - listitem [ref=f33e877]:
            - paragraph [ref=f33e878]: refuse to fulfil the Trade; and/or
        - list [ref=f33e879]:
          - listitem [ref=f33e880]:
            - paragraph [ref=f33e881]: Close Out the Trade in accordance with Clause 21.
        - list [ref=f33e882]:
          - listitem [ref=f33e883]:
            - paragraph [ref=f33e884]: Failure to make Payment in accordance with this Clause 18 will be a material breach of this Agreement.
        - paragraph [ref=f33e885]:
          - strong [ref=f33e886]: Forward Contracts
        - list [ref=f33e887]:
          - listitem [ref=f33e888]:
            - paragraph [ref=f33e889]: Where you wish to enter into a Forward Contract, we may require you to make an initial Margin payment within twenty-four (24) hours of you receiving the Transaction Receipt.
        - list [ref=f33e890]:
          - listitem [ref=f33e891]:
            - paragraph [ref=f33e892]: From time to time during the term of the Forward Contract, we may require you to pay to us additional Margin (by making a Margin Call) to maintain the relative value of the Purchase Currency.
        - list [ref=f33e893]:
          - listitem [ref=f33e894]:
            - paragraph [ref=f33e895]: In the event of a Margin Call, you must pay such additional Margin to our Nominated Account within twenty-four (24) hours of our demand from your Currency Account and/or by some other means.
        - list [ref=f33e896]:
          - listitem [ref=f33e897]:
            - paragraph [ref=f33e898]: If you do not satisfy the Margin Call, we may cancel the Forward Contract with immediate effect or Close Out.
        - list [ref=f33e899]:
          - listitem [ref=f33e900]:
            - paragraph [ref=f33e901]: Any Margin paid by you or on your behalf will be paid to us for the purpose of securing or covering all your present or future, actual or contingent, or prospective, obligations to us under this Agreement or otherwise. We will acquire full ownership of such Margin and we will shall not hold any Margin on your behalf (whether on trust or otherwise) and we can deal with it as our own. In the event of our insolvency, you will rank as a general creditor of ours in relation to such Margin paid to us.
        - list [ref=f33e902]:
          - listitem [ref=f33e903]:
            - paragraph [ref=f33e904]: We will owe you a debt equal to the amount of Margin received by us, subject to any set-off rights under, or other terms of, this Agreement, or under general law. We shall pay to you all or part of any amount of Margin owed to us by you (e.g. upon fulfilment of a Trade) under this clause to the extent that we consider, in our discretion, that the amount of Margin you have transferred to us exceeds the amount required by us to secure or cover all your present or future, actual or contingent, or prospective obligations to us under this Agreement or otherwise.
        - list [ref=f33e905]:
          - listitem [ref=f33e906]:
            - paragraph [ref=f33e907]: You may ask us to bring forward (pre-deliver) the Delivery Date or to extend (roll over) the Delivery Date in relation to the whole or only part of your Forward Contract. We may agree to such a request entirely at our discretion. If we agree, you acknowledge that we may adjust the Payment Amount to reflect new Delivery Date.
        - paragraph [ref=f33e908]:
          - strong [ref=f33e909]: Limit Orders
        - list [ref=f33e910]:
          - listitem [ref=f33e911]:
            - paragraph [ref=f33e912]: We will execute a Limit Order when we achieve the rate nominated by you within the agreed time period.
        - list [ref=f33e913]:
          - listitem [ref=f33e914]:
            - paragraph [ref=f33e915]: If the last day of the agreed time period falls on a non-Business Day, your Limit Order will expire on the following Business Day.
        - list [ref=f33e916]:
          - listitem [ref=f33e917]:
            - paragraph [ref=f33e918]: You may cancel a Limit Order at any time (by telephone or by email), up until the agreed exchange rate is achieved by us.
        - list [ref=f33e919]:
          - listitem [ref=f33e920]:
            - paragraph [ref=f33e921]: Upon successful execution of a Limit Order, we will provide you with a Transaction Receipt setting out the details of the Trade.
        - list [ref=f33e922]:
          - listitem [ref=f33e923]:
            - paragraph [ref=f33e924]: Whilst we will try to achieve the agreed exchange rate within the agreed period, we cannot guarantee that the agreed exchange rate will be met.
        - paragraph [ref=f33e925]:
          - strong [ref=f33e926]: Close out
        - list [ref=f33e927]:
          - listitem [ref=f33e928]:
            - paragraph [ref=f33e929]: "We may Close Out a particular Trade or all current Trades that you have with us, without notice to you:"
        - list [ref=f33e930]:
          - listitem [ref=f33e931]:
            - paragraph [ref=f33e932]: if you fail to make any Payment when it is due, including payment of Margin;
        - list [ref=f33e933]:
          - listitem [ref=f33e934]:
            - paragraph [ref=f33e935]: if you fail to provide any information we have requested or any warranty/representation you have given us is or becomes, in our opinion, materially inaccurate, incorrect or misleading;
        - list [ref=f33e936]:
          - listitem [ref=f33e937]:
            - paragraph [ref=f33e938]: in the event of your death or loss of mental capacity;
        - list [ref=f33e939]:
          - listitem [ref=f33e940]:
            - paragraph [ref=f33e941]: in the event that you are Insolvent;
        - list [ref=f33e942]:
          - listitem [ref=f33e943]:
            - paragraph [ref=f33e944]: if you take some action (or refrain from doing something) which places us in breach of our legal or regulatory obligations;
        - list [ref=f33e945]:
          - listitem [ref=f33e946]:
            - paragraph [ref=f33e947]: if the performance of our obligations under this Agreement become illegal;
        - list [ref=f33e948]:
          - listitem [ref=f33e949]:
            - paragraph [ref=f33e950]: if you breach this Agreement;
        - list [ref=f33e951]:
          - listitem [ref=f33e952]:
            - paragraph [ref=f33e953]: if you terminate this Agreement in accordance with Clause 9; or
        - list [ref=f33e954]:
          - listitem [ref=f33e955]:
            - paragraph [ref=f33e956]: the Trade is outside our financial crime risk appetite.
        - list [ref=f33e957]:
          - listitem [ref=f33e958]:
            - paragraph [ref=f33e959]: "You may ask us to Close Out a particular Trade or current Trades by giving us notice in writing. If we permit you to Close Out:"
        - list [ref=f33e960]:
          - listitem [ref=f33e961]:
            - paragraph [ref=f33e962]: we will buy back the currency that we have bought for you when you entered into the Trades at prevailing market rates. If the value of the Purchase Currency has strengthened, this means that a loss will be incurred on the Trade and you will be liable to us for the amount of that loss (as well as any costs incurred by us);
        - list [ref=f33e963]:
          - listitem [ref=f33e964]:
            - paragraph [ref=f33e965]: we will not pay you any profit arising the Close Out;
        - list [ref=f33e966]:
          - listitem [ref=f33e967]:
            - paragraph [ref=f33e968]: you acknowledge that the amount of any loss realised on the Closing Out of a Trade is a debt payable by you and agree that we may immediately deduct the total amount of any loss (together with any costs) from your Currency Account;
        - list [ref=f33e969]:
          - listitem [ref=f33e970]:
            - paragraph [ref=f33e971]: if the amount we are seeking to recover exceeds the amount of any Margin or funds available in your Currency Account, you must pay the balance within seven (7) days of being notified by us of the total amount due;
        - list [ref=f33e972]:
          - listitem [ref=f33e973]:
            - paragraph [ref=f33e974]: we may charge you interest on any sum that remains payable to us after we Close Out at a rate of 5% per annum over the Bank of England base rate. Interest will accrue and will be calculated daily and be compounded monthly from the date payment was due until the date full payment is made by you; and
        - list [ref=f33e975]:
          - listitem [ref=f33e976]:
            - paragraph [ref=f33e977]: we will send you a written statement explaining the amount of any sums that may be payable to us and the amount of any sums being withheld by us.
        - paragraph [ref=f33e978]:
          - strong [ref=f33e979]: GENERAL
        - paragraph [ref=f33e980]:
          - strong [ref=f33e981]: Other Important Terms
        - list [ref=f33e982]:
          - listitem [ref=f33e983]:
            - paragraph [ref=f33e984]: "Ajeer Money is a trading name of Monex Internatinal Limited, a company incorporated under the laws of England and Wales with registration number 04974470 and authorised by FCA as a Small Payment Institution FRN-510848. Registered address: 32 Spring Street, Paddington, London, W2 1JA"
        - list [ref=f33e985]:
          - listitem [ref=f33e986]:
            - paragraph [ref=f33e987]: No express term of this Agreement (nor any term implied under it) is enforceable pursuant to the Contracts (Rights of Third Parties) Act 1999 or otherwise by any person who is not a party to it.
        - list [ref=f33e988]:
          - listitem [ref=f33e989]:
            - paragraph [ref=f33e990]: We may agree to communicate with you in one or more languages depending on the location of the Ajeer Representative which provides Services to you. The primary business language used by Ajeer is English, and so if we have not expressly agreed otherwise, communications from you to us (in particular legal notices, correspondence and documentation) should be in the English language.
        - list [ref=f33e991]:
          - listitem [ref=f33e992]:
            - paragraph [ref=f33e993]: "We may listen in to or record phone calls with you (or any of your Authorised Parties) to:"
        - list [ref=f33e994]:
          - listitem [ref=f33e995]:
            - paragraph [ref=f33e996]: check we are carrying out your instructions correctly and that we are meeting our regulatory obligations;
        - list [ref=f33e997]:
          - listitem [ref=f33e998]:
            - paragraph [ref=f33e999]: help detect or prevent fraud or other crimes; and
        - list [ref=f33e1000]:
          - listitem [ref=f33e1001]:
            - paragraph [ref=f33e1002]: improve our Services.
        - list [ref=f33e1003]:
          - listitem [ref=f33e1004]:
            - paragraph [ref=f33e1005]: If any part of this Agreement is disallowed or found to be ineffective by a court or regulator, the rest of it shall continue to apply.
        - list [ref=f33e1006]:
          - listitem [ref=f33e1007]:
            - paragraph [ref=f33e1008]: We may choose not to enforce our rights against you and make this contractually binding against us by giving you a notice which expressly states that we have chosen to do so under this term of the Agreement. In all other cases, if we choose not to exercise rights against you, we can still do so later.
        - list [ref=f33e1009]:
          - listitem [ref=f33e1010]:
            - paragraph [ref=f33e1011]: "We may:"
        - list [ref=f33e1012]:
          - listitem [ref=f33e1013]:
            - paragraph [ref=f33e1014]: assign any or all of our rights under this Agreement to any third parties; and
        - list [ref=f33e1015]:
          - listitem [ref=f33e1016]:
            - paragraph [ref=f33e1017]: transfer (by novation or otherwise) all or any of our obligations under this Agreement to any person (a Transferee) provided that no transfer or our obligations will be effective until the Transferee has confirmed to you in writing that it is bound by the terms of this Agreement.
        - list [ref=f33e1018]:
          - listitem [ref=f33e1019]:
            - paragraph [ref=f33e1020]: In the event of our insolvency, a third party back-up servicer shall be appointed such and - to the extent permissible under Applicable Laws - shall be entitled to administer any pending Transfers, Trades (including by effecting Close Outs) and handle any Payments paid or payable.
        - list [ref=f33e1021]:
          - listitem [ref=f33e1022]:
            - paragraph [ref=f33e1023]: You may not transfer any of your rights or obligations under this Agreement.
        - list [ref=f33e1024]:
          - listitem [ref=f33e1025]:
            - paragraph [ref=f33e1026]: The laws of the country which you are resident in will decide any legal questions about these Terms, and about our dealings with you with a view to entering into this Agreement, e.g. if you live in England, the laws of England will apply.
        - list [ref=f33e1027]:
          - listitem [ref=f33e1028]:
            - paragraph [ref=f33e1029]: The courts of the country in which you are resident can deal with any legal questions connected with this Agreement.
        - paragraph [ref=f33e1030]:
          - strong [ref=f33e1031]: Rewards
        - list [ref=f33e1032]:
          - listitem [ref=f33e1033]:
            - paragraph [ref=f33e1034]: Program Overview
        - list [ref=f33e1035]:
          - listitem [ref=f33e1036]:
            - paragraph [ref=f33e1037]: The Ajeer Remittance Rewards Program (“Program”) is a promotional campaign designed to reward remitters who send money internationally using the Ajeer app. Eligible Remitters and Beneficiaries will be entered into monthly lucky draws to win exciting prizes.
        - list [ref=f33e1038]:
          - listitem [ref=f33e1039]:
            - paragraph [ref=f33e1040]: Definitions
        - list [ref=f33e1041]:
          - listitem [ref=f33e1042]:
            - paragraph [ref=f33e1043]: "Remitter: The individual or corporate customer who sends money overseas via the Ajeer app."
        - list [ref=f33e1044]:
          - listitem [ref=f33e1045]:
            - paragraph [ref=f33e1046]: "Beneficiary: The individual who receives the remittance."
        - list [ref=f33e1047]:
          - listitem [ref=f33e1048]:
            - paragraph [ref=f33e1049]: "Chances: Points earned based on the remittance amount, used to determine lucky draw eligibility."
        - list [ref=f33e1050]:
          - listitem [ref=f33e1051]:
            - paragraph [ref=f33e1052]: "Draw: The monthly process of selecting winners from eligible participants."
        - list [ref=f33e1053]:
          - listitem [ref=f33e1054]:
            - paragraph [ref=f33e1055]: Eligibility
        - list [ref=f33e1056]:
          - listitem [ref=f33e1057]:
            - paragraph [ref=f33e1058]: a. The Program is open to individuals (at least 18 years old) and corporates who are residents or citizens of the United Kingdom.
        - list [ref=f33e1059]:
          - listitem [ref=f33e1060]:
            - paragraph [ref=f33e1061]: b. Only transactions made through the Ajeer app are eligible.
        - list [ref=f33e1062]:
          - listitem [ref=f33e1063]:
            - paragraph [ref=f33e1064]: c. To qualify for the monthly reward draw, the minimum remittance amount must be £100 per transaction.
        - list [ref=f33e1065]:
          - listitem [ref=f33e1066]:
            - paragraph [ref=f33e1067]: d. A Remitter may have multiple Beneficiaries. Beneficiaries can earn chances to win based on the qualifying amounts they receive.
        - list [ref=f33e1068]:
          - listitem [ref=f33e1069]:
            - paragraph [ref=f33e1070]: Reward Structure
        - list [ref=f33e1071]:
          - listitem [ref=f33e1072]:
            - paragraph [ref=f33e1073]: "a. Chances to win are earned based on the amount remitted in a single transaction through the Ajeer app. The following slab structure applies:"
        - table [ref=f33e1074]:
          - rowgroup [ref=f33e1078]:
            - row [ref=f33e1079]:
              - cell [ref=f33e1080]:
                - paragraph [ref=f33e1081]:
                  - strong [ref=f33e1082]: Remittance Amount (GBP)
              - cell [ref=f33e1083]:
                - paragraph [ref=f33e1084]:
                  - strong [ref=f33e1085]: Chances to Win Earned
            - row [ref=f33e1086]:
              - cell [ref=f33e1087]:
                - paragraph [ref=f33e1088]: £100 – £299
              - cell [ref=f33e1089]:
                - paragraph [ref=f33e1090]: 1x (1 chance)
            - row [ref=f33e1091]:
              - cell [ref=f33e1092]:
                - paragraph [ref=f33e1093]: £300 – £499
              - cell [ref=f33e1094]:
                - paragraph [ref=f33e1095]: 2x (2 chances)
            - row [ref=f33e1096]:
              - cell [ref=f33e1097]:
                - paragraph [ref=f33e1098]: £500 – £999
              - cell [ref=f33e1099]:
                - paragraph [ref=f33e1100]: 3x (3 chances)
            - row [ref=f33e1101]:
              - cell [ref=f33e1102]:
                - paragraph [ref=f33e1103]: £1000 – £1999
              - cell [ref=f33e1104]:
                - paragraph [ref=f33e1105]: 4x (4 chances)
            - row [ref=f33e1106]:
              - cell [ref=f33e1107]:
                - paragraph [ref=f33e1108]: £2000 – £3499
              - cell [ref=f33e1109]:
                - paragraph [ref=f33e1110]: 5x (5 chances)
            - row [ref=f33e1111]:
              - cell [ref=f33e1112]:
                - paragraph [ref=f33e1113]: £3500 – £5000
              - cell [ref=f33e1114]:
                - paragraph [ref=f33e1115]: 6x (6 chances) (capped)
            - row [ref=f33e1116]:
              - cell [ref=f33e1117]:
                - paragraph [ref=f33e1118]: £5000+
              - cell [ref=f33e1119]:
                - paragraph [ref=f33e1120]: 6x (6 chances) (capped)
        - list [ref=f33e1121]:
          - listitem [ref=f33e1122]:
            - paragraph [ref=f33e1123]: b. Chances are awarded per transaction. Multiple qualifying transactions can be made within the same month to earn more chances.
        - list [ref=f33e1124]:
          - listitem [ref=f33e1125]:
            - paragraph [ref=f33e1126]: c. There is no limit to how many chances a user can earn in a given month.
        - list [ref=f33e1127]:
          - listitem [ref=f33e1128]:
            - paragraph [ref=f33e1129]: d. The maximum number of chances that can be earned in a single transaction is 6, even if the remitted amount exceeds £5000.
        - list [ref=f33e1130]:
          - listitem [ref=f33e1131]:
            - paragraph [ref=f33e1132]: e. Chances do not roll over to the next month and are non-transferable.
        - list [ref=f33e1133]:
          - listitem [ref=f33e1134]:
            - paragraph [ref=f33e1135]: f. A greater number of chances increases the likelihood of winning the lucky draw.
        - list [ref=f33e1136]:
          - listitem [ref=f33e1137]:
            - paragraph [ref=f33e1138]: Winner Selection & Draw Process
        - list [ref=f33e1139]:
          - listitem [ref=f33e1140]:
            - paragraph [ref=f33e1141]: a. Separate monthly draws will be conducted for Remitters and Beneficiaries.
        - list [ref=f33e1142]:
          - listitem [ref=f33e1143]:
            - paragraph [ref=f33e1144]: b. Each month, three (3) winners will be selected from the Remitters’ pool and three (3) from the Beneficiaries’ pool, based on the number of chances earned.
        - list [ref=f33e1145]:
          - listitem [ref=f33e1146]:
            - paragraph [ref=f33e1147]: c. Winners are chosen via a computerized random selection system.
        - list [ref=f33e1148]:
          - listitem [ref=f33e1149]:
            - paragraph [ref=f33e1150]: d. A participant may win only once per draw per month.
        - list [ref=f33e1151]:
          - listitem [ref=f33e1152]:
            - paragraph [ref=f33e1153]: e. Names of winning Remitters will be announced via Ajeer’s social media platforms and the Ajeer app or website.
        - list [ref=f33e1154]:
          - listitem [ref=f33e1155]:
            - paragraph [ref=f33e1156]: f. Names of winning Beneficiaries will be announced via Ajeer’s social media platforms and the website of the participating bank.
        - list [ref=f33e1157]:
          - listitem [ref=f33e1158]:
            - paragraph [ref=f33e1159]: Notification & Prize Claim
        - list [ref=f33e1160]:
          - listitem [ref=f33e1161]:
            - paragraph [ref=f33e1162]: a. Remitter winners will be contacted via phone call and may also receive notification through email or in-app message.
        - list [ref=f33e1163]:
          - listitem [ref=f33e1164]:
            - paragraph [ref=f33e1165]: b. Beneficiary winners will be contacted via phone call.
        - list [ref=f33e1166]:
          - listitem [ref=f33e1167]:
            - paragraph [ref=f33e1168]: c. Prizes must be claimed within 15 days of notification. Failure to do so may result in disqualification.
        - list [ref=f33e1169]:
          - listitem [ref=f33e1170]:
            - paragraph [ref=f33e1171]: d. Proof of identity and verification of the transaction may be required to claim prizes.
        - list [ref=f33e1172]:
          - listitem [ref=f33e1173]:
            - paragraph [ref=f33e1174]: Prize Details
        - list [ref=f33e1175]:
          - listitem [ref=f33e1176]:
            - paragraph [ref=f33e1177]: a. Prizes include, but are not limited to Umrah tickets, smartphones, electronics, and other lifestyle gadgets.
        - list [ref=f33e1178]:
          - listitem [ref=f33e1179]:
            - paragraph [ref=f33e1180]: b. Ajeer reserves the right to substitute a prize with another prize without prior notice.
        - list [ref=f33e1181]:
          - listitem [ref=f33e1182]:
            - paragraph [ref=f33e1183]: c. Beneficiaries who receive a total of £200 or more through the Ajeer app within a calendar month will automatically receive one (1) month of complimentary Gold membership on the Bogo Liv app.
        - list [ref=f33e1184]:
          - listitem [ref=f33e1185]:
            - paragraph [ref=f33e1186]:
              - text: c(i). Bogo Liv Membership – Terms and disclosure The complimentary Gold membership referred to is provided by Bogo Technologies (Private) Limited (‘Bogo Liv’) and is subject to Bogo Liv’s own terms and conditions and privacy policy, which are available at (
              - link "https://bogo.pk/" [ref=f33e1187] [cursor=pointer]:
                - /url: https://bogo.pk/
              - text: ) , and is limited to Pakistan only. Ajeer Money makes no representation regarding the value, content, availability, or ongoing terms of Bogo Liv membership. The Gold membership is provided for one (1) calendar month from the date of award. It does not renew automatically and does not carry any cash value. Availability of the Bogo Liv app and its features may vary by country. Ajeer Money is not responsible for any inability to access or use the Bogo Liv membership due to geographic restrictions or changes to the Bogo Liv service. Receipt of the Bogo Liv membership does not constitute a financial promotion and does not form part of any regulated financial service provided by Ajeer Money.
        - list [ref=f33e1188]:
          - listitem [ref=f33e1189]:
            - paragraph [ref=f33e1190]: d. Prizes are non-transferable and non-exchangable.
        - list [ref=f33e1191]:
          - listitem [ref=f33e1192]:
            - paragraph [ref=f33e1193]: e. All prizes will be gifted by Bogo Technologies (Private) Limited under the brand name of Bogo Liv.
        - paragraph [ref=f33e1194]:
          - strong [ref=f33e1195]: Prize Delivery and Liability
          - text: All prizes under this programme are provided and fulfilled by Bogo Technologies (Private) Limited (trading as ‘Bogo Liv’) (Prize Provider). Ajeer Money acts solely as the promoter of this Programme and is not responsible for the manufacture, quality, delivery, or fulfilment of any prize. In the event that the Prize Provider fails to deliver a prize to a verified winner within thirty (30) days of the winner being notified, Ajeer Money will, at its sole discretion, take reasonable steps to liaise with the Prize Provider to facilitate delivery. If delivery cannot be arranged within a further thirty (30) days, Ajeer Money reserves the right to substitute the prize with an alternative prize of equal or greater value. To the maximum extent permitted by applicable law, Ajeer Money’s total liability to any prize winner in connection with non-delivery or substitution of a prize shall not exceed the retail value of the original prize as determined by Ajeer Money at its reasonable discretion. Nothing in this clause limits or excludes any liability that cannot be excluded under applicable law, including liability for fraud or fraudulent misrepresentation. By participation in this Programme, you acknowledge and agree that your primary recourse for prize fulfilment is with the Prize Provider, and that Ajeer Money’s obligations are limited to those set out in this clause.
        - paragraph [ref=f33e1196]:
          - strong [ref=f33e1197]: Terms of Use
        - paragraph [ref=f33e1198]: This section together tells you the terms of use on which you may make use of our website (our site), whether as a guest or a registered user. Please read these terms of use carefully before you start to use the site. By using our site, you indicate that you accept these terms of use and that you agree to abide by them. If you do not agree to these terms of use, please refrain from using our site.
