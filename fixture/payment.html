<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AutoQA Fixture — Payment Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 4rem auto; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    input[type="number"] { width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }
    button { padding: 0.5rem 1.5rem; }
    nav { margin-bottom: 2rem; }
  </style>
</head>
<body>
  <nav><a href="/">Home</a></nav>
  <h1>Payment Demo</h1>
  <p>Local simulation only — no real payment is ever processed.</p>
  <form id="payment-form">
    <label for="amount">Amount</label>
    <input type="number" id="amount" name="amount" />
    <button type="submit" id="pay-fail-btn">Simulate Payment Error</button>
  </form>

  <hr />

  <form id="payment-consistency-form">
    <label for="pc-amount">Payment Amount</label>
    <input type="number" id="pc-amount" name="amount" />
    <button type="submit" id="pc-submit-btn">Submit Payment</button>
  </form>
  <p id="payment-consistency-status"></p>

  <script>
    // SEED-003 (http-failure, /payment): submitting always triggers a
    // server-side 500 on POST /api/pay-fail, regardless of amount.
    document.getElementById("payment-form").addEventListener("submit", function (event) {
      event.preventDefault();
      fetch("/api/pay-fail", { method: "POST" });
    });

    // SEED-006 (ui-api-consistency, /payment): POST /api/payment-consistency
    // always returns HTTP 500, but the UI incorrectly shows "Payment
    // successful" regardless -- a genuine UI/API consistency defect,
    // distinct from SEED-003 (which correctly shows nothing on failure).
    document.getElementById("payment-consistency-form").addEventListener("submit", function (event) {
      event.preventDefault();
      fetch("/api/payment-consistency", { method: "POST" }).finally(function () {
        document.getElementById("payment-consistency-status").textContent = "Payment successful";
      });
    });
  </script>
</body>
</html>
